<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10131d">
    <title>霓虹打磚樂</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #f7f4ec;
            --muted: #9ea6b8;
            --lime: #d6ff4f;
            --pink: #ff5d91;
            --cyan: #50e4e8;
            --panel: #1a1f2d;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(ellipse at 12% 12%, #472234 0, transparent 29rem),
                radial-gradient(ellipse at 90% 84%, #153c43 0, transparent 31rem),
                #10131d;
            font-family: "Trebuchet MS", "Microsoft JhengHei", sans-serif;
        }
        .page { width: min(100% - 32px, 900px); margin: 0 auto; padding: 24px 0 22px; }
        .topline { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 12px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-mark { display: grid; place-items: center; width: 42px; aspect-ratio: 1; border: 1px solid #d6ff4f66; color: var(--lime); background: #d6ff4f12; transform: rotate(-8deg); font-size: 22px; }
        .eyebrow { margin: 0 0 3px; color: var(--cyan); font-size: .7rem; font-weight: 800; letter-spacing: .18em; }
        h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 2rem); line-height: 1.1; }
        .sound-button, .action-button {
            border: 1px solid #ffffff32;
            border-radius: 5px;
            color: var(--ink);
            background: #ffffff0a;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: border-color .18s, background .18s, transform .18s;
        }
        .sound-button { min-height: 40px; padding: 0 13px; }
        .sound-button:hover, .action-button:hover { border-color: var(--cyan); background: #50e4e814; }
        .sound-button:active, .action-button:active { transform: translateY(1px); }
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(100%, 560px); margin: 0 auto 10px; }
        .stat { min-width: 0; padding: 8px 12px 7px; border-left: 2px solid #ffffff2a; background: #ffffff08; }
        .stat:nth-child(1) { border-color: var(--lime); }
        .stat:nth-child(2) { border-color: var(--pink); }
        .stat:nth-child(3) { border-color: var(--cyan); }
        .stat:nth-child(4) { border-color: #ba91ff; }
        .stat-label { display: block; margin-bottom: 2px; color: var(--muted); font-size: .66rem; letter-spacing: .12em; }
        .stat-value { font-size: 1.05rem; font-variant-numeric: tabular-nums; font-weight: 800; }
        .stage-wrap { position: relative; width: min(100%, 520px); margin: 0 auto; perspective: 1100px; }
        .stage {
            overflow: hidden;
            border: 1px solid #d5ff5d70;
            border-radius: 5px;
            background: #121827;
            box-shadow: 0 18px 60px #0008, 0 0 35px #d6ff4f13, inset 0 0 0 4px #ffffff08;
            transform: rotateX(1.2deg);
            transform-origin: center bottom;
        }
        canvas { display: block; width: 100%; height: auto; aspect-ratio: 6 / 7; touch-action: none; }
        .below { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: min(100%, 520px); margin: 10px auto 0; }
        .hint { margin: 0; color: var(--muted); font-size: .8rem; line-height: 1.5; }
        .hint strong { color: var(--ink); font-weight: 700; }
        .action-button { flex: 0 0 auto; min-height: 39px; padding: 0 16px; color: #11150c; border-color: var(--lime); background: var(--lime); }
        .action-button:hover { color: var(--lime); background: #d6ff4f12; }
        @media (max-width: 520px) {
            .page { width: min(100% - 22px, 440px); padding-top: 15px; }
            .topline { margin-bottom: 10px; }
            .brand-mark { width: 36px; }
            .dashboard { gap: 5px; }
            .stat { padding: 7px 8px 6px; }
            .stat-value { font-size: .96rem; }
            .below { align-items: flex-start; }
            .hint { font-size: .72rem; }
            .action-button { min-height: 36px; padding: 0 11px; font-size: .83rem; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="page">
        <header class="topline">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true">✦</div>
                <div><p class="eyebrow">ARCADE / 07</p><h1>霓虹打磚樂</h1></div>
            </div>
            <button class="sound-button" id="soundButton" type="button" aria-pressed="true">♫ 音效開</button>
        </header>
        <section class="dashboard" aria-label="遊戲狀態">
            <div class="stat"><span class="stat-label">分數</span><span class="stat-value" id="score">0000</span></div>
            <div class="stat"><span class="stat-label">生命</span><span class="stat-value" id="lives">♥ ♥ ♥</span></div>
            <div class="stat"><span class="stat-label">關卡</span><span class="stat-value" id="level">01</span></div>
            <div class="stat"><span class="stat-label">剩餘磚塊</span><span class="stat-value" id="remaining">35</span></div>
        </section>
        <section class="stage-wrap" aria-label="打磚塊遊戲區">
            <div class="stage"><canvas id="game" width="720" height="840" aria-label="用擋板反彈小球，打掉所有磚塊"></canvas></div>
        </section>
        <footer class="below">
            <p class="hint"><strong>← →</strong> / <strong>A D</strong> 移動・滑鼠或觸控拖曳<br><strong>空白鍵</strong> 發球 / 暫停</p>
            <button class="action-button" id="actionButton" type="button">開始遊戲</button>
        </footer>
    </main>
    <script>
        const canvas = document.querySelector('#game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.querySelector('#score');
        const livesEl = document.querySelector('#lives');
        const levelEl = document.querySelector('#level');
        const remainingEl = document.querySelector('#remaining');
        const actionButton = document.querySelector('#actionButton');
        const soundButton = document.querySelector('#soundButton');
        const W = canvas.width, H = canvas.height;
        const colors = ['#ff5d91', '#ff9d45', '#d6ff4f', '#50e4e8', '#b99aff'];
        let bricks = [], particles = [], stars = [], score = 0, lives = 3, level = 1;
        let state = 'ready', soundOn = true, audio, lastTime = 0, keys = {};
        const ball = { x: W / 2, y: H - 96, r: 10, vx: 0, vy: 0, speed: 390 };
        const paddle = { x: W / 2, y: H - 55, w: 132, h: 17, speed: 570 };

        function makeBricks() {
            bricks = [];
            const columns = 7, rows = Math.min(5 + Math.floor((level - 1) / 2), 7);
            const gap = 9, width = 76, height = 24, left = (W - (columns * width + (columns - 1) * gap)) / 2;
            for (let row = 0; row < rows; row++) for (let col = 0; col < columns; col++) {
                bricks.push({ x: left + col * (width + gap), y: 108 + row * (height + 13), w: width, h: height, color: colors[(row + level - 1) % colors.length], alive: true, hp: row === 0 && level > 1 ? 2 : 1 });
            }
            remainingEl.textContent = bricks.length;
        }
        function resetBall() {
            ball.x = paddle.x; ball.y = paddle.y - 20; ball.vx = 0; ball.vy = 0;
        }
        function startGame() {
            if (state === 'over' || state === 'won') { score = 0; lives = 3; level = 1; makeBricks(); }
            state = 'playing';
            if (!ball.vx && !ball.vy) launchBall();
            actionButton.textContent = '暫停';
            updateHud();
        }
        function launchBall() {
            const direction = Math.random() < .5 ? -1 : 1;
            ball.vx = direction * ball.speed * .34;
            ball.vy = -Math.sqrt(ball.speed * ball.speed - ball.vx * ball.vx);
            tone(480, .12, 'triangle', .035, 780);
        }
        function updateHud() {
            scoreEl.textContent = String(score).padStart(4, '0');
            livesEl.textContent = lives > 0 ? Array.from({ length: lives }, () => '♥').join(' ') : '0';
            levelEl.textContent = String(level).padStart(2, '0');
        }
        function tone(freq, duration, type = 'sine', volume = .04, endFreq = freq) {
            if (!soundOn) return;
            try {
                audio ||= new (window.AudioContext || window.webkitAudioContext)();
                if (audio.state === 'suspended') audio.resume();
                const oscillator = audio.createOscillator(), gain = audio.createGain();
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(freq, audio.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), audio.currentTime + duration);
                gain.gain.setValueAtTime(volume, audio.currentTime);
                gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
                oscillator.connect(gain); gain.connect(audio.destination);
                oscillator.start(); oscillator.stop(audio.currentTime + duration);
            } catch (_) { /* Audio is optional; the game stays playable without it. */ }
        }
        function burst(x, y, color) {
            for (let index = 0; index < 12; index++) {
                const angle = Math.random() * Math.PI * 2, speed = 45 + Math.random() * 190;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: .35 + Math.random() * .45, color });
            }
        }
        function loseLife() {
            lives--; updateHud(); tone(220, .36, 'square', .055, 55);
            if (lives <= 0) { state = 'over'; actionButton.textContent = '再玩一次'; tone(150, .55, 'sawtooth', .05, 45); }
            else { state = 'ready'; resetBall(); actionButton.textContent = '繼續遊戲'; }
        }
        function hitBrick(brick) {
            brick.hp--;
            if (brick.hp <= 0) {
                brick.alive = false; score += 10 * level; burst(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color);
                remainingEl.textContent = bricks.filter(item => item.alive).length;
                tone(260 + Math.random() * 200, .11, 'sine', .04, 520 + Math.random() * 300);
            } else {
                tone(190, .08, 'triangle', .035, 320);
            }
            updateHud();
        }
        function update(dt) {
            stars.forEach(star => { star.y += star.speed * dt; if (star.y > H) { star.y = 0; star.x = Math.random() * W; } });
            particles.forEach(particle => { particle.x += particle.vx * dt; particle.y += particle.vy * dt; particle.vy += 120 * dt; particle.life -= dt; });
            particles = particles.filter(particle => particle.life > 0);
            if (state !== 'playing') return;
            if (keys.ArrowLeft || keys.a || keys.A) paddle.x -= paddle.speed * dt;
            if (keys.ArrowRight || keys.d || keys.D) paddle.x += paddle.speed * dt;
            paddle.x = Math.max(paddle.w / 2 + 8, Math.min(W - paddle.w / 2 - 8, paddle.x));
            ball.x += ball.vx * dt; ball.y += ball.vy * dt;
            if (ball.x < ball.r || ball.x > W - ball.r) { ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x)); ball.vx *= -1; tone(320, .06, 'sine', .02, 250); }
            if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); tone(340, .06, 'sine', .02, 270); }
            if (ball.vy > 0 && ball.y + ball.r >= paddle.y && ball.y - ball.r < paddle.y + paddle.h && ball.x > paddle.x - paddle.w / 2 && ball.x < paddle.x + paddle.w / 2) {
                const offset = (ball.x - paddle.x) / (paddle.w / 2);
                const speed = Math.min(640, Math.hypot(ball.vx, ball.vy) * 1.015);
                ball.vx = offset * speed * .78;
                ball.vy = -Math.sqrt(speed * speed - ball.vx * ball.vx);
                ball.y = paddle.y - ball.r;
                tone(440 + Math.abs(offset) * 160, .09, 'triangle', .035, 650);
            }
            for (const brick of bricks) {
                if (!brick.alive) continue;
                const closestX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.w));
                const closestY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.h));
                const dx = ball.x - closestX, dy = ball.y - closestY;
                if (dx * dx + dy * dy <= ball.r * ball.r) {
                    if (Math.abs(dx) > Math.abs(dy)) ball.vx *= -1; else ball.vy *= -1;
                    hitBrick(brick); break;
                }
            }
            if (ball.y - ball.r > H) loseLife();
            if (bricks.every(brick => !brick.alive)) {
                level++; makeBricks(); ball.speed = Math.min(560, ball.speed + 30); resetBall(); state = 'ready';
                actionButton.textContent = '下一關'; tone(520, .2, 'triangle', .05, 880); updateHud();
            }
        }
        function polygon(points, fill) {
            ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(points[0][0], points[0][1]);
            points.slice(1).forEach(point => ctx.lineTo(point[0], point[1])); ctx.closePath(); ctx.fill();
        }
        function drawBrick(brick) {
            const depth = 8;
            ctx.save();
            ctx.shadowColor = brick.color; ctx.shadowBlur = 12;
            ctx.fillStyle = brick.color; ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
            ctx.shadowBlur = 0;
            polygon([[brick.x, brick.y + brick.h], [brick.x + brick.w, brick.y + brick.h], [brick.x + brick.w + depth, brick.y + brick.h + depth], [brick.x + depth, brick.y + brick.h + depth]], `${brick.color}99`);
            polygon([[brick.x + brick.w, brick.y], [brick.x + brick.w + depth, brick.y + depth], [brick.x + brick.w + depth, brick.y + brick.h + depth], [brick.x + brick.w, brick.y + brick.h]], `${brick.color}70`);
            ctx.fillStyle = '#ffffff68'; ctx.fillRect(brick.x + 5, brick.y + 4, brick.w - 10, 2);
            if (brick.hp > 1) { ctx.fillStyle = '#171b26'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('×2', brick.x + brick.w / 2, brick.y + 17); }
            ctx.restore();
        }
        function draw() {
            ctx.clearRect(0, 0, W, H);
            const background = ctx.createLinearGradient(0, 0, W, H); background.addColorStop(0, '#141a2b'); background.addColorStop(1, '#202338');
            ctx.fillStyle = background; ctx.fillRect(0, 0, W, H);
            ctx.save(); ctx.strokeStyle = '#ffffff08'; ctx.lineWidth = 1;
            for (let x = 22; x < W; x += 38) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
            for (let y = 18; y < H; y += 38) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
            stars.forEach(star => { ctx.globalAlpha = star.alpha; ctx.fillStyle = '#ffffff'; ctx.fillRect(star.x, star.y, star.size, star.size); }); ctx.restore();
            bricks.forEach(brick => { if (brick.alive) drawBrick(brick); });
            particles.forEach(particle => { ctx.globalAlpha = Math.min(1, particle.life * 2); ctx.fillStyle = particle.color; ctx.fillRect(particle.x, particle.y, 5, 5); }); ctx.globalAlpha = 1;
            ctx.save(); ctx.shadowColor = '#50e4e8'; ctx.shadowBlur = 23;
            const paddleGradient = ctx.createLinearGradient(paddle.x - paddle.w / 2, paddle.y, paddle.x + paddle.w / 2, paddle.y);
            paddleGradient.addColorStop(0, '#50e4e8'); paddleGradient.addColorStop(.5, '#e8ffff'); paddleGradient.addColorStop(1, '#50e4e8');
            ctx.fillStyle = paddleGradient; ctx.beginPath(); ctx.roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 7); ctx.fill();
            ctx.fillStyle = '#ffffff70'; ctx.fillRect(paddle.x - paddle.w / 2 + 12, paddle.y + 3, paddle.w - 24, 2); ctx.restore();
            ctx.save(); ctx.shadowColor = '#fff7b0'; ctx.shadowBlur = 22; ctx.fillStyle = '#fff6bf'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            if (state !== 'playing') {
                ctx.fillStyle = '#0b101c9c'; ctx.fillRect(0, 0, W, H);
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const headline = state === 'over' ? '遊戲結束' : state === 'won' ? '漂亮！' : state === 'paused' ? '暫停中' : '準備好了？';
                ctx.fillStyle = '#d6ff4f'; ctx.font = '800 48px "Microsoft JhengHei", sans-serif'; ctx.fillText(headline, W / 2, H / 2 - 28);
                ctx.fillStyle = '#f7f4ec'; ctx.font = '22px "Microsoft JhengHei", sans-serif';
                const subtitle = state === 'over' ? `最終分數　${String(score).padStart(4, '0')}` : state === 'paused' ? '按空白鍵繼續' : '把球打回去，清空所有磚塊';
                ctx.fillText(subtitle, W / 2, H / 2 + 24);
            }
        }
        function loop(now) { const dt = Math.min((now - lastTime) / 1000 || 0, .035); lastTime = now; update(dt); draw(); requestAnimationFrame(loop); }
        function movePaddle(event) {
            const rect = canvas.getBoundingClientRect();
            paddle.x = Math.max(paddle.w / 2 + 8, Math.min(W - paddle.w / 2 - 8, (event.clientX - rect.left) * W / rect.width));
            if (state === 'ready') resetBall();
        }
        stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, speed: 10 + Math.random() * 28, size: .8 + Math.random() * 1.8, alpha: .2 + Math.random() * .7 }));
        makeBricks(); resetBall(); updateHud(); requestAnimationFrame(loop);
        window.addEventListener('keydown', event => {
            if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
            keys[event.key] = true;
            if (event.key === ' ' && !event.repeat) {
                if (state === 'playing') { state = 'paused'; actionButton.textContent = '繼續遊戲'; }
                else if (state === 'paused') startGame();
                else startGame();
            }
        });
        window.addEventListener('keyup', event => { keys[event.key] = false; });
        canvas.addEventListener('pointermove', movePaddle);
        canvas.addEventListener('pointerdown', event => { event.preventDefault(); movePaddle(event); if (state === 'ready') startGame(); canvas.setPointerCapture(event.pointerId); });
        actionButton.addEventListener('click', () => {
            if (state === 'playing') { state = 'paused'; actionButton.textContent = '繼續遊戲'; }
            else startGame();
        });
        soundButton.addEventListener('click', () => {
            soundOn = !soundOn; soundButton.textContent = soundOn ? '♫ 音效開' : '♫ 音效關';
            soundButton.setAttribute('aria-pressed', String(soundOn)); if (soundOn) tone(520, .12, 'triangle');
        });
    </script>
</body>
</html>
